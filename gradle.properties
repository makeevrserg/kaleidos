# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4G"
# Java. IntelliJ Platform 2024.2+ is compiled for Java 21
klibs.java.source=21
klibs.java.target=21
klibs.java.ktarget=21
# Project
klibs.project.name=compose-html-preview
klibs.project.group=com.makeevrserg.compose.html.preview
klibs.project.version.string=0.1.0
klibs.project.description=IntelliJ plugin that previews Compose HTML (DOM) composables inside the IDE
klibs.project.developers=makeevrserg|Makeev Roman|makeevrserg@gmail.com
klibs.project.url=https://github.com/makeevrserg/MVIKotlin-Decompose-Plugin

# IntelliJ Platform the plugin is compiled against. It is also the oldest supported IDE build.
intellij.version=2025.1.7.2
intellij.sinceBuild=251
