name: "build-project"
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build_project:
    name: Build plugin distribution with Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Give gradle permission
        run: chmod +x gradlew
      # The same task the release builds, so a pull request fails before master does.
      # Tests and detekt run in their own jobs, so `build` would only repeat them here.
      - name: Build plugin distribution with Gradle
        run: ./gradlew :plugin:buildPlugin --stacktrace
