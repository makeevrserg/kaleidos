name: Release Master
on:
  push:
    branches:
      - master

# Explicit least-privilege token permissions so the workflow behaves
# the same in personal repositories and organizations regardless of
# the default GITHUB_TOKEN settings. Jobs that need more (e.g. creating
# a release) elevate their permissions individually.
permissions:
  contents: read

jobs:
  gradle_wrapper_validation:
    name: Validate Gradle wrapper
    uses: ./.github/workflows/call-gradle-wrapper-validation.yml
  upload_artifacts:
    name: Build and upload plugin distribution
    needs: [ gradle_wrapper_validation ]
    uses: ./.github/workflows/call-upload-artifacts.yml
  upload_github_release:
    name: Upload GitHub release
    needs: [ upload_artifacts ]
    permissions:
      contents: write
    uses: ./.github/workflows/call-upload-github-release.yml
    secrets:
      ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
  upload_jetbrains_release:
    name: Upload JetBrains Marketplace release
    needs: [ upload_artifacts ]
    uses: ./.github/workflows/call-upload-jetbrains-release.yml
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
