name: "upload-artifacts"
on:
  workflow_call:

permissions:
  contents: read

jobs:
  upload_artifacts:
    name: Build and upload plugin distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Give gradle permission
        run: chmod +x gradlew
      - name: Build plugin distribution with Gradle
        run: ./gradlew :plugin:buildPlugin --stacktrace
      - name: Upload plugin distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          # buildPlugin writes <klibs.project.name>-<klibs.project.version.string>.zip here
          path: ./plugin/build/distributions/*.zip
          if-no-files-found: error
