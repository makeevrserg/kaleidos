name: "setup-jdk"
description: "Sets up the project JDK (Temurin) used across all workflows"
inputs:
  java-version:
    description: "JDK version to install"
    required: false
    # IntelliJ Platform 2026.2 runs on Java 25, and the project compiles for it (klibs.java.* in gradle.properties)
    default: "25"
runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}
