name: "setup-jdk"
description: "Sets up the project JDK (Temurin) used across all workflows"
inputs:
  java-version:
    description: "JDK version to install"
    required: false
    # IntelliJ Platform 2026.2 runs on Java 25, and the project compiles for it (klibs.java.* in gradle.properties)
    default: "25"
runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}
